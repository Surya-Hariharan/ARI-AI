name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  # Fast feedback: formatting and static analysis fail in ~2 minutes rather than
  # after a full assemble.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # --no-configuration-cache: Spotless 6.x is not configuration-cache compatible and
      # fails with "Spotless JVM-local cache is stale" whenever the restored Gradle cache
      # was written by a different JVM (https://github.com/diffplug/spotless/issues/987).
      # Remove once Spotless is on 7.x.
      - name: Spotless
        run: ./gradlew spotlessCheck --no-daemon --no-configuration-cache

      - name: Detekt
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lint --no-daemon

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: android
          category: detekt
        continue-on-error: true

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `test` is the only task name that covers all three module shapes in this build:
      #   * JVM modules (:core:shared)            -> `test`
      #   * Android library modules (:core:oem …) -> `testDebugUnitTest` / `testReleaseUnitTest`
      #   * `:app`, which has dev/prod flavours   -> `testDevDebugUnitTest` etc.
      # The previous `testDevDebugUnitTest` matched only `:app` — which has no test sources —
      # so this job passed while executing zero tests. Naming variant tasks explicitly is how
      # that regression happens, so prefer the aggregate and let the guard below enforce it.
      - name: Unit tests
        run: ./gradlew test --no-daemon -Pari.warningsAsErrors=true

      - name: Verify tests actually ran
        run: |
          count=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | wc -l)
          echo "Found $count test result files"
          test "$count" -gt 0 || { echo "::error::No tests executed"; exit 1; }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/**/build/reports/tests/

  assemble:
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew assembleDevDebug --no-daemon -Pari.warningsAsErrors=true

      # Proves the R8 rules in app/proguard-rules.pro actually hold. A minified
      # build that fails only in release is the classic way serialization rules
      # get discovered too late.
      - name: Assemble minified release
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ari-dev-debug
          path: android/app/build/outputs/apk/dev/debug/*.apk

  instrumented-test:
    runs-on: ubuntu-latest
    # Emulator runs are slow and flaky enough that they gate main, not every PR.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: android
          script: ./gradlew connectedDevDebugAndroidTest --no-daemon
