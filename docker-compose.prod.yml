# ============================================================
# ARI — Production Compose
# ============================================================
# docker-compose.yml is the DEVELOPMENT environment: it bind-mounts source, runs
# `air` and `uvicorn --reload`, and publishes ports for convenience. That is a good
# dev loop and a poor deployment target — source is mounted rather than baked,
# reloaders watch the filesystem, and every service is reachable from the host.
#
# This file is the interim production target until the Kubernetes work in Phase 5.
# Differences that matter:
#   * no bind mounts — the image is the artifact
#   * no hot reloaders
#   * only the gateway is published; everything else is internal
#   * resource limits, restart policies, log rotation
#   * Redis requires a password and persists with AOF
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Required in .env.production (startup fails without them):
#   JWT_SECRET, DATABASE_URL, ALLOWED_ORIGINS, APP_BASE_URL,
#   ARI_SERVICE_TOKEN, REDIS_PASSWORD, VOICE_EMBEDDING_KEY,
#   ARI_MEMORY_ENCRYPTION_KEY, RESEND_API_KEY, ENV=production
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *default-logging
  networks: [ari-internal]

services:
  redis:
    <<: *common
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction   # rate-limit counters and locks must not be silently evicted
    expose: ["6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M }

  gateway:
    <<: *common
    build:
      context: ./backend/gateway
    # The only service exposed to the host. Terminate TLS in front of this
    # (reverse proxy / load balancer); the gateway itself speaks plain HTTP here.
    ports:
      - "8080:8080"
    environment:
      ENV: production
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      AGENT_URL: http://agent:8000
      ARI_SERVICE_TOKEN: ${ARI_SERVICE_TOKEN:?ARI_SERVICE_TOKEN is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: ${DATABASE_URL:?}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      VOICE_EMBEDDING_KEY: ${VOICE_EMBEDDING_KEY:?}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

  agent:
    <<: *common
    build:
      context: ./backend
      dockerfile: agent/Dockerfile
    expose: ["8000"]
    environment:
      ENV: production
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ARI_SERVICE_TOKEN: ${ARI_SERVICE_TOKEN:?}
      ARI_MEMORY_ENCRYPTION_KEY: ${ARI_MEMORY_ENCRYPTION_KEY:?}
      ARI_VOICEPRINT_ENCRYPTION_KEY: ${ARI_VOICEPRINT_ENCRYPTION_KEY:-}
      ARI_SPACY_AUTO_DOWNLOAD: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Model loading dominates startup; a short window would restart-loop forever.
      start_period: 180s
    deploy:
      resources:
        limits: { memory: 8G }

  execution:
    <<: *common
    build:
      context: ./backend/execution
    expose: ["9090"]
    environment:
      ENV: production
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      AGENT_URL: http://agent:8000
      ARI_SERVICE_TOKEN: ${ARI_SERVICE_TOKEN:?}
      DATABASE_URL: ${DATABASE_URL:?}
      EXECUTION_HEALTH_PORT: "9090"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    # The worker finishes its current task before exiting; give it room to drain
    # rather than losing in-flight work on every deploy.
    stop_grace_period: 120s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

networks:
  ari-internal:
    driver: bridge

volumes:
  redis-data:
