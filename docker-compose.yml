services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./backend/gateway
    ports:
      - "8080:8080"
    volumes:
      - ./backend/gateway:/app
    command: ["air"]
    environment:
      - REDIS_ADDR=redis:6379
      - AGENT_URL=http://agent:8000
    env_file:
      - .env
    depends_on:
      - redis

  agent:
    build:
      context: ./backend/agent
    ports:
      - "8000:8000"
    volumes:
      - ./backend/agent:/app
    environment:
      - REDIS_ADDR=redis:6379
      - ARI_SPACY_AUTO_DOWNLOAD=false
    env_file:
      - .env
    depends_on:
      - redis
    # FastAPI hot-reloading enabled by --reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  execution:
    build:
      context: ./backend/execution
    volumes:
      - ./backend/execution:/app
    command: ["air"]
    environment:
      - REDIS_ADDR=redis:6379
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
      - VITE_GATEWAY_URL=http://gateway:8080
