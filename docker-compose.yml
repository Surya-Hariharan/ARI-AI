services:
  redis:
    image: redis:7
    # Published for local inspection (redis-cli) only. docker-compose.prod.yml keeps
    # it internal.
    ports:
      - "127.0.0.1:6379:6379"

  gateway:
    build:
      context: ./backend/gateway
    ports:
      - "8080:8080"
    volumes:
      - ./backend/gateway:/app
    command: ["air"]
    environment:
      - REDIS_ADDR=redis:6379
      - AGENT_URL=http://agent:8000
    env_file:
      - .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: ./backend
      dockerfile: agent/Dockerfile
    # No `ports:` mapping. The agent exposes voiceprint enrollment/deletion,
    # arbitrary tool execution via /execute, and RAG ingestion; publishing it to the
    # host makes all of that reachable from outside the compose network. The gateway
    # and execution worker reach it as http://agent:8000 over the internal network.
    # To poke at it during development: docker compose exec agent sh
    expose:
      - "8000"
    volumes:
      - ./backend/agent:/app
    environment:
      - REDIS_ADDR=redis:6379
      - ARI_SPACY_AUTO_DOWNLOAD=false
    env_file:
      - .env
    depends_on:
      - redis
    # FastAPI hot-reloading enabled by --reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  execution:
    build:
      context: ./backend/execution
    # Health port stays internal; nothing outside the cluster needs to probe a worker.
    expose:
      - "9090"
    volumes:
      - ./backend/execution:/app
    command: ["air"]
    environment:
      - REDIS_ADDR=redis:6379
      - EXECUTION_HEALTH_PORT=9090
    env_file:
      - .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
      - VITE_GATEWAY_URL=http://gateway:8080
