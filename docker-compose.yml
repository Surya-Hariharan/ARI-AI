version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./backend/gateway_go
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis

  agent:
    build:
      context: ./backend/agent_python
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  execution:
    build:
      context: ./backend/execution_go
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
