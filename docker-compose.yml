version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./backend/gateway_go
    ports:
      - "8080:8080"
    volumes:
      - ./backend/gateway_go:/app
    command: /bin/sh -c "go get github.com/gofiber/fiber/v2@v2.52.5 github.com/gofiber/websocket/v2@v2.2.1 github.com/redis/go-redis/v9@v9.7.0 github.com/jackc/pgx/v5/pgxpool@v5.7.2 github.com/google/uuid@v1.6.0 && go mod tidy && air"
    environment:
      - REDIS_ADDR=redis:6379
      - AGENT_URL=http://agent:8000
    env_file:
      - .env
    depends_on:
      - redis

  agent:
    build:
      context: ./backend/agent_python
    ports:
      - "8000:8000"
    volumes:
      - ./backend/agent_python:/app
    environment:
      - REDIS_ADDR=redis:6379
    env_file:
      - .env
    depends_on:
      - redis
    # FastAPI hot-reloading enabled by --reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  execution:
    build:
      context: ./backend/execution_go
    volumes:
      - ./backend/execution_go:/app
    command: /bin/sh -c "go get github.com/jackc/pgx/v5/pgxpool@v5.7.2 github.com/redis/go-redis/v9@v9.7.0 github.com/google/uuid@v1.6.0 && go mod tidy && air"
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HOST=0.0.0.0
