version: '3.8'

services:
  gateway_go:
    build:
      context: ../backend/gateway_go
      dockerfile: ../../infra/docker/Dockerfile.gateway_go
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  agent_service_py:
    build:
      context: ../backend/agent_service_py
      dockerfile: ../../infra/docker/Dockerfile.agent_service_py
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  execution_workers_go:
    build:
      context: ../backend/execution_workers_go
      dockerfile: ../../infra/docker/Dockerfile.execution_workers_go
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ari_db
    ports:
      - "5432:5432"
